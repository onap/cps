delta:
  get:
    description: Get delta between two anchors within a given dataspace
    tags:
      - cps-delta
    summary: Get delta between anchors in the same dataspace
    operationId: getDeltaByDataspaceAndAnchors
    parameters:
      - $ref: 'components.yml#/components/parameters/dataspaceNameInPath'
      - $ref: 'components.yml#/components/parameters/sourceAnchorNameInPath'
      - $ref: 'components.yml#/components/parameters/targetAnchorNameInQuery'
      - $ref: 'components.yml#/components/parameters/xpathInQuery'
      - $ref: 'components.yml#/components/parameters/descendantsInQuery'
      - $ref: 'components.yml#/components/parameters/groupDataNodesInQuery'
      - $ref: 'components.yml#/components/parameters/contentTypeInHeader'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
            examples:
              dataSample:
                $ref: 'components.yml#/components/examples/deltaReportSample'
          application/xml:
            schema:
              type: object
              xml:
                name: deltaReports
            examples:
              dataSample:
                $ref: 'components.yml#/components/examples/deltaReportSampleXml'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: 'components.yml#/components/schemas/ErrorMessage'
            example:
              status: 400
              message: Bad Request
              details: The provided request is not valid
          application/xml:
            schema:
              $ref: 'components.yml#/components/schemas/ErrorMessage'
            example: |
              <?xml version="1.0" encoding="UTF-8"?>
              <ErrorMessage>
                <status>400</status>
                <message>Bad Request</message>
                <details>The provided request is not valid</details>
              </ErrorMessage>
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: 'components.yml#/components/schemas/ErrorMessage'
            example:
              status: 403
              message: Request Forbidden
              details: This request is forbidden
          application/xml:
            schema:
              $ref: 'components.yml#/components/schemas/ErrorMessage'
            example: |
              <?xml version="1.0" encoding="UTF-8"?>
              <ErrorMessage>
                <status>403</status>
                <message>Request Forbidden</message>
                <details>This request is forbidden</details>
              </ErrorMessage>
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "components.yml#/components/schemas/ErrorMessage"
            example:
              status: 500
              message: Internal Server Error
              details: Internal Server Error occurred
          application/xml:
            schema:
              $ref: 'components.yml#/components/schemas/ErrorMessage'
            example: |
              <?xml version="1.0" encoding="UTF-8"?>
              <ErrorMessage>
                <status>500</status>
                <message>Internal Server Error</message>
                <details>Internal Server Error occurred</details>
              </ErrorMessage>
    x-codegen-request-body-name: xpath
  post:
    description: Get delta between an anchor in a dataspace
    tags:
      - cps-delta
    summary: Get delta between an anchor and JSON payload
    operationId: getDeltaByDataspaceAnchorAndPayload
    parameters:
      - $ref: 'components.yml#/components/parameters/dataspaceNameInPath'
      - $ref: 'components.yml#/components/parameters/sourceAnchorNameInPath'
      - $ref: 'components.yml#/components/parameters/xpathInQuery'
      - $ref: 'components.yml#/components/parameters/groupDataNodesInQuery'
      - $ref: 'components.yml#/components/parameters/acceptMediaType'

    requestBody:
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              targetData:
                   description: Upload the targetData file in JSON or XML format.
                   type: string
                   format: binary
                   example:
                     $ref: 'components.yml#/components/schemas/targetData'
              yangResourceFile:
                    type: string
                    format: binary
                    example:
                      $ref: 'components.yml#/components/schemas/MultipartFile'
            required:
              - targetData
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
            examples:
              dataSample:
                $ref: 'components.yml#/components/examples/deltaReportSample'
          application/xml:
            schema:
              type: object
              xml:
                name: deltaReports
            examples:
              dataSample:
                $ref: 'components.yml#/components/examples/deltaReportSampleXml'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: 'components.yml#/components/schemas/ErrorMessage'
            example:
              status: 400
              message: Bad Request
              details: The provided request is not valid
          application/xml:
            schema:
              $ref: 'components.yml#/components/schemas/ErrorMessage'
            example: |
              <?xml version="1.0" encoding="UTF-8"?>
              <ErrorMessage>
                <status>400</status>
                <message>Bad Request</message>
                <details>The provided request is not valid</details>
              </ErrorMessage>
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: 'components.yml#/components/schemas/ErrorMessage'
            example:
              status: 401
              message: Unauthorized request
              details: This request is unauthorized
          application/xml:
            schema:
              $ref: 'components.yml#/components/schemas/ErrorMessage'
            example: |
              <?xml version="1.0" encoding="UTF-8"?>
              <ErrorMessage>
                <status>401</status>
                <message>Unauthorized request</message>
                <details>This request is unauthorized</details>
              </ErrorMessage>
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: 'components.yml#/components/schemas/ErrorMessage'
            example:
              status: 403
              message: Request Forbidden
              details: This request is forbidden
          application/xml:
            schema:
              $ref: 'components.yml#/components/schemas/ErrorMessage'
            example: |
              <?xml version="1.0" encoding="UTF-8"?>
              <ErrorMessage>
                <status>403</status>
                <message>Request Forbidden</message>
                <details>This request is forbidden</details>
              </ErrorMessage>
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "components.yml#/components/schemas/ErrorMessage"
            example:
              status: 500
              message: Internal Server Error
              details: Internal Server Error occurred
          application/xml:
            schema:
              $ref: 'components.yml#/components/schemas/ErrorMessage'
