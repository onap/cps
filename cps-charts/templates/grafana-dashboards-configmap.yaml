{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cps-and-ncmp.release-name" . }}-grafana-dashboards
  labels:
    app: {{ include "cps-and-ncmp.name" . }}
    component: grafana
data:
  {{- range $path, $_ := .Files.Glob "config/grafana/*.json" }}
  {{ $path | base }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
