apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cps-and-ncmp.release-name" . }}
  labels:
    app: {{ include "cps-and-ncmp.name" . }}
    component: cps-and-ncmp
spec:
  # Remote JVM debug attaches to a single JVM, so a debug session must target
  # exactly one CPS instance. Force a single replica when debug is enabled.
  replicas: {{ if .Values.cps.debug.enabled }}1{{ else }}{{ .Values.cps.replicas }}{{ end }}
  selector:
    matchLabels:
      app: {{ include "cps-and-ncmp.name" . }}
      component: cps
  template:
    metadata:
      labels:
        app: {{ include "cps-and-ncmp.name" . }}
        component: cps
    spec:
      serviceAccountName: cps-hazelcast-service-account
      initContainers:
        # Wait for PostgreSQL and Kafka to be ready
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z {{ include "cps-and-ncmp.release-name" . }}-postgresql-service 5432; do
                echo "PostgreSQL not ready, waiting..."
                sleep 2
              done
              echo "PostgreSQL is ready"
              echo "Waiting for Kafka..."
              until nc -z {{ include "cps-and-ncmp.release-name" . }}-kafka-service 9092; do
                echo "Kafka not ready, waiting..."
                sleep 2
              done
              echo "Kafka is ready"
              echo "All dependencies are ready"
      containers:
        - name: cps
          image: "{{ .Values.cps.image.repository }}:{{ .Values.cps.image.tag }}"
          imagePullPolicy: {{ .Values.cps.image.pullPolicy }}
          ports:
            - containerPort: 8080
            - containerPort: 5701
            {{- if .Values.cps.debug.enabled }}
            - containerPort: {{ .Values.cps.debug.port }}
              name: jvm-debug
            {{- end }}
          env:
            {{- range $envName, $envValue := .Values.cps.env }}
            {{- if ne $envName "JAVA_TOOL_OPTIONS" }}
            - name: {{ $envName | upper }}
              value: "{{ $envValue }}"
            {{- end }}
            {{- end }}
            # JAVA_TOOL_OPTIONS is emitted once here so the remote-debug JDWP agent
            # can be appended when cps.debug.enabled is true. A debugger attaches over
            # this agent; suspend=n lets CPS start normally until a debugger connects.
            - name: JAVA_TOOL_OPTIONS
              value: "{{ .Values.cps.env.JAVA_TOOL_OPTIONS }}{{ if .Values.cps.debug.enabled }} -agentlib:jdwp=transport=dt_socket,server=y,suspend={{ .Values.cps.debug.suspend }},address=*:{{ .Values.cps.debug.port }}{{ end }}"
            - name: CPS_NCMP_SERVICE_NAME
              value: cps-{{ include "cps-and-ncmp.name" . }}-hazelcast-service
          resources:
            {{- toYaml .Values.cps.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.cps.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.cps.readinessProbe | nindent 12 }}
