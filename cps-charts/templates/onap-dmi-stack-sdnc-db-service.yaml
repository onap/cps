{{- if .Values.onapDmiStack.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cps-and-ncmp.release-name" . }}-sdnc-db-service
  labels:
    app: {{ include "cps-and-ncmp.name" . }}
    component: sdnc-db
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mysql
  selector:
    app: {{ include "cps-and-ncmp.name" . }}
    component: sdnc-db
{{- end }}
