{{- if .Values.onapDmiStack.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cps-and-ncmp.release-name" . }}-ncmp-dmi-plugin-service
  labels:
    app: {{ include "cps-and-ncmp.name" . }}
    component: ncmp-dmi-plugin
spec:
  type: {{ .Values.onapDmiStack.ncmpDmiPlugin.service.type }}
  ports:
    - port: {{ .Values.onapDmiStack.ncmpDmiPlugin.service.port }}
      targetPort: {{ .Values.onapDmiStack.ncmpDmiPlugin.containerPort }}
      protocol: TCP
      name: http
      {{- if and (eq .Values.onapDmiStack.ncmpDmiPlugin.service.type "NodePort") .Values.onapDmiStack.ncmpDmiPlugin.service.nodePort }}
      nodePort: {{ .Values.onapDmiStack.ncmpDmiPlugin.service.nodePort }}
      {{- end }}
  selector:
    app: {{ include "cps-and-ncmp.name" . }}
    component: ncmp-dmi-plugin
{{- end }}
