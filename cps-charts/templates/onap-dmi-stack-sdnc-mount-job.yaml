{{- if .Values.onapDmiStack.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cps-and-ncmp.release-name" . }}-sdnc-mount-node
  labels:
    app: {{ include "cps-and-ncmp.name" . }}
    component: sdnc
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.onapDmiStack.sdncMountJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.onapDmiStack.sdncMountJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app: {{ include "cps-and-ncmp.name" . }}
        component: sdnc
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-sdnc
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              # Neither a TCP check nor a GET on the netconf topology is enough:
              # Karaf opens port {{ .Values.onapDmiStack.sdnc.service.port }} and serves an empty
              # topology-netconf container minutes before the netconf mount
              # machinery is usable. A mount written in that window is accepted
              # and then silently discarded. SLI-API:healthcheck only answers once
              # Karaf has finished installing its features, so poll that instead -
              # it is the same signal the sdnc readinessProbe uses.
              echo "Waiting for SDNC to finish booting..."
              until curl --silent --fail --max-time 10 --request POST \
                --header "Authorization: Basic {{ printf "%s:%s" .Values.onapDmiStack.sdnc.env.ODL_ADMIN_USERNAME .Values.onapDmiStack.sdnc.env.ODL_ADMIN_PASSWORD | b64enc }}" \
                --header 'Content-Type: application/json' \
                "http://{{ include "cps-and-ncmp.release-name" . }}-sdnc-service:{{ .Values.onapDmiStack.sdnc.service.port }}/rests/operations/SLI-API:healthcheck" \
                >/dev/null; do
                echo "SDNC not booted yet, waiting..."
                sleep 10
              done
              echo "SDNC has finished booting"
        - name: wait-for-pnfsim
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for pnfsim..."
              until nc -z {{ include "cps-and-ncmp.release-name" . }}-pnfsim-service 6513; do
                echo "pnfsim not ready, waiting..."
                sleep 5
              done
              echo "pnfsim is reachable"
      containers:
        - name: sdnc-mount-node
          image: curlimages/curl:8.10.1
          command: ["sh", "/scripts/check_sdnc_mount_node.sh"]
          env:
            - name: SDNC_HOST
              value: "{{ include "cps-and-ncmp.release-name" . }}-sdnc-service"
            - name: SDNC_PORT
              value: "{{ .Values.onapDmiStack.sdnc.service.port }}"
            - name: PNF_SIM_HOST
              value: "{{ include "cps-and-ncmp.release-name" . }}-pnfsim-service"
            - name: PNF_SIM_PORT
              value: "6513"
            - name: NODE_ID
              value: "{{ .Values.onapDmiStack.sdncMountJob.nodeId }}"
          volumeMounts:
            - name: sdnc-mount-script
              mountPath: /scripts
      volumes:
        - name: sdnc-mount-script
          configMap:
            name: {{ include "cps-and-ncmp.release-name" . }}-sdnc-mount-script
            defaultMode: 0755
{{- end }}
