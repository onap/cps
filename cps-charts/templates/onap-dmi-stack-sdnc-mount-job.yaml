{{- if .Values.onapDmiStack.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cps-and-ncmp.release-name" . }}-sdnc-mount-node
  labels:
    app: {{ include "cps-and-ncmp.name" . }}
    component: sdnc
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.onapDmiStack.sdncMountJob.backoffLimit }}
  template:
    metadata:
      labels:
        app: {{ include "cps-and-ncmp.name" . }}
        component: sdnc
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-sdnc
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for SDNC..."
              until nc -z {{ include "cps-and-ncmp.release-name" . }}-sdnc-service {{ .Values.onapDmiStack.sdnc.service.port }}; do
                echo "SDNC not ready, waiting..."
                sleep 5
              done
              echo "SDNC is reachable"
        - name: wait-for-pnfsim
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for pnfsim..."
              until nc -z {{ include "cps-and-ncmp.release-name" . }}-pnfsim-service 6513; do
                echo "pnfsim not ready, waiting..."
                sleep 5
              done
              echo "pnfsim is reachable"
      containers:
        - name: sdnc-mount-node
          image: curlimages/curl:8.10.1
          command: ["sh", "/scripts/check_sdnc_mount_node.sh"]
          env:
            - name: SDNC_HOST
              value: "{{ include "cps-and-ncmp.release-name" . }}-sdnc-service"
            - name: SDNC_PORT
              value: "{{ .Values.onapDmiStack.sdnc.service.port }}"
            - name: PNF_SIM_HOST
              value: "{{ include "cps-and-ncmp.release-name" . }}-pnfsim-service"
            - name: PNF_SIM_PORT
              value: "6513"
            - name: NODE_ID
              value: "{{ .Values.onapDmiStack.sdncMountJob.nodeId }}"
          volumeMounts:
            - name: sdnc-mount-script
              mountPath: /scripts
      volumes:
        - name: sdnc-mount-script
          configMap:
            name: {{ include "cps-and-ncmp.release-name" . }}-sdnc-mount-script
            defaultMode: 0755
{{- end }}
