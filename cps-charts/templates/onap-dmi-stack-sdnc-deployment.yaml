{{- if .Values.onapDmiStack.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cps-and-ncmp.release-name" . }}-sdnc
  labels:
    app: {{ include "cps-and-ncmp.name" . }}
    component: sdnc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cps-and-ncmp.name" . }}
      component: sdnc
  template:
    metadata:
      labels:
        app: {{ include "cps-and-ncmp.name" . }}
        component: sdnc
    spec:
      initContainers:
        - name: wait-for-sdnc-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for sdnc-db..."
              until nc -z {{ include "cps-and-ncmp.release-name" . }}-sdnc-db-service 3306; do
                echo "sdnc-db not ready, waiting..."
                sleep 2
              done
              echo "sdnc-db is ready"
      containers:
        - name: sdnc
          image: "{{ .Values.onapDmiStack.sdnc.image }}"
          # SDNC's own startup scripts/properties connect to the DB using the
          # hostnames dbhost/sdnctldb01/sdnctldb02 (from docker-compose
          # "links" aliases in docker-compose/dmi-services.yml). Kubernetes
          # has no equivalent, so alias them to the sdnc-db-service ClusterIP
          # (resolved via getent) before invoking the real startup script.
          # /etc/hosts is root-owned and the image's default user (uid 100)
          # cannot write to it, so this one step runs as root.
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-c"]
          args:
            - |
              DB_IP=$(getent hosts {{ include "cps-and-ncmp.release-name" . }}-sdnc-db-service | awk '{ print $1 }' | head -1)
              echo "Resolved sdnc-db-service to $DB_IP"
              echo "$DB_IP dbhost sdnctldb01 sdnctldb02" >> /etc/hosts
              exec /opt/onap/sdnc/bin/startODL.sh
          ports:
            - containerPort: 8181
          env:
            {{- range $key, $value := .Values.onapDmiStack.sdnc.env }}
            - name: {{ $key | upper }}
              value: "{{ $value }}"
            {{- end }}
          volumeMounts:
            - name: sdnc-certs
              mountPath: /opt/opendaylight/certs/certs.properties
              subPath: certs.properties
            - name: sdnc-certs
              mountPath: /opt/opendaylight/certs/keys0.zip
              subPath: keys0.zip
          resources:
            {{- toYaml .Values.onapDmiStack.sdnc.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.onapDmiStack.sdnc.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.onapDmiStack.sdnc.readinessProbe | nindent 12 }}
      volumes:
        - name: sdnc-certs
          secret:
            secretName: {{ include "cps-and-ncmp.release-name" . }}-sdnc-certs
{{- end }}
