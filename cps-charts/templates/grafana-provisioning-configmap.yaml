{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cps-and-ncmp.release-name" . }}-grafana-provisioning
  labels:
    app: {{ include "cps-and-ncmp.name" . }}
    component: grafana
data:
  dashboard.yml: |
    {{- .Files.Get "config/grafana/provisioning/dashboards/dashboard.yml" | nindent 4 }}
  datasource.yml: |
    {{- .Files.Get "config/grafana/provisioning/datasources/datasource.yml" | nindent 4 }}
{{- end }}
