global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
- job_name: 'cps-and-ncmp'
  metrics_path: '/actuator/prometheus'
  scrape_interval: 5s
  static_configs:
    - targets:
      - 'cps-ncmp-service:8080'

- job_name: 'postgres'
  static_configs:
    - targets:
      - 'cps-ncmp-postgres-exporter:9187'
