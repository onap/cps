---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Gerrit-triggered Maven verify pipeline for cps.
#
# gerrit_to_platform dispatches this workflow (via the GitHub API) when a
# patchset is created (or on a `recheck` comment); it then votes Verified
# +/-1 on the change. It runs the reusable Maven verify lane from
# lfreleng-actions/java-workflows and is intended to run ALONGSIDE the
# existing Jenkins verify job during the migration.
#
# Discovery is filename-convention based: the name contains BOTH 'gerrit'
# AND 'verify', so gerrit_to_platform dispatches it on patchset-created.
# The file must exist on every active branch (dispatch targets
# refs/heads/{GERRIT_BRANCH}); this initial deployment covers `master`.
name: 'Gerrit Verify'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: 'Branch that change is against'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_ID:
        description: 'The ID for the change'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_NUMBER:
        description: 'The Gerrit number'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_URL:
        description: 'URL to the change'
        required: false
        type: string
        default: ''
      GERRIT_EVENT_TYPE:
        description: 'Type of Gerrit event'
        required: false
        type: string
        default: ''
      GERRIT_PATCHSET_NUMBER:
        description: 'The patch number for the change'
        required: false
        type: string
        default: ''
      GERRIT_PATCHSET_REVISION:
        description: 'The revision sha'
        required: false
        type: string
        default: ''
      GERRIT_PROJECT:
        description: 'Project in Gerrit'
        required: false
        type: string
        default: ''
      GERRIT_REFSPEC:
        description: 'Gerrit refspec of change'
        required: false
        type: string
        default: ''
      GERRIT_DISABLED:
        description: 'Run without Gerrit components'
        required: false
        default: false
        type: boolean

concurrency:
  group: '${{ github.event.inputs.GERRIT_CHANGE_ID || github.run_id }}'
  cancel-in-progress: true

permissions: {}

jobs:
  # Clear any previous Verified vote so the change starts from a clean
  # state on each patchset/recheck.
  clear-vote:
    name: 'Clear Gerrit Vote'
    if: inputs.GERRIT_DISABLED != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - name: 'Clear votes'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@a1c036a59b94c8ab89de26d378f6a28cc7378b13  # v1.1.2
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}  # zizmor: ignore[secrets-outside-env]
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear
      - name: 'Allow replication'
        run: sleep 10s

  # Call the reusable Maven verify lane. When dispatched by Gerrit the
  # gerrit_* inputs drive the reusable workflow's Gerrit-aware checkout;
  # for a manual GERRIT_DISABLED run they are blanked so it falls back to
  # a standard checkout of the calling repository.
  #
  # Pinned to v0.1.2. The job timeouts introduced in v0.0.4 remain the
  # reason this lane completes at all: build 45 minutes, and 30 each for
  # tests, SBOM and Grype. The fixed 10 minutes before that killed this
  # reactor at module 18 of 24 while it was still compiling. A full run
  # now builds in a little under 15 minutes, so the defaults suit cps
  # with room to spare and nothing is set below; pass
  # build_timeout_minutes if the reactor outgrows them.
  #
  # v0.1.0 added optional build artefact publication and removed a dead
  # github_summary input that produced a warning annotation on every
  # run. upload_build_artifacts stays off here deliberately: nothing
  # downstream consumes the jars yet, and uploading a 24-module reactor
  # on every patchset would cost storage for no reader. Turn it on when
  # a merge, stage or container lane needs the output.
  #
  # v0.1.2 carries maven-build-action v0.3.1, which stops that action
  # leaving a Maven settings document in the workspace. This lane builds
  # the code under review, so a credentials file left there was readable
  # by the plugins and tests of the patchset being verified.
  build-test:
    needs: clear-vote
    if: >-
      always()
      && (needs.clear-vote.result == 'success'
          || needs.clear-vote.result == 'skipped')
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/java-workflows/.github/workflows/maven-build-test.yaml@cb4d89f992669dbb10c1c016fed9829d41517c5f  # v0.1.2
    with:
      # master stream builds on Java 21 (paris/Java 17 handled separately).
      java_version: '21'
      # Skip Jib container image builds during verify; the merge/stage
      # lanes own image publication.
      #
      # docker.pull.registry has no default in the cps POMs: Jenkins
      # supplies it through the managed settings.xml, so a build without
      # one leaves ${docker.pull.registry} unsubstituted and the
      # Testcontainers specs in cps-ncmp-service and cps-ri fail to pull
      # their Kafka and PostgreSQL images. Sourced from the organisation
      # variable rather than hardcoded, with the current value as a
      # fallback. Note this is CONTAINER_PUBLIC_REGISTRY (10001, the
      # Docker Hub proxy) and NOT the similarly named
      # CONTAINER_PULL_REGISTRY, which serves a different repository and
      # returns 404 for these images. docker.push.registry goes unused
      # while Jib is skipped, and is set only to keep the property
      # resolved across the reactor.
      # yamllint disable-line rule:line-length
      mvn_params: "-Djib.skip=true -Ddocker.pull.registry=${{ vars.CONTAINER_PUBLIC_REGISTRY || 'nexus3.onap.org:10001' }} -Ddocker.push.registry=${{ vars.CONTAINER_PUSH_REGISTRY || 'nexus3.onap.org:10002' }}"
      # Run the build job's harden-runner in audit while the egress
      # footprint is characterised, then tighten to block.
      #
      # Worth knowing: before java-workflows v0.0.3 this input silently
      # did nothing, because the workflow chose between two
      # harden-runner steps with a step-level 'if:' and the action's
      # pre-phase ignores that. Every build so far therefore ran under a
      # block policy, and the only endpoint it actually lacked was the
      # ONAP Docker proxy, now carried by the allow-list in v0.0.3. The
      # toggle takes effect for the first time here, so keep it on until
      # a full run has been observed; the reactor has never built past
      # cps-ncmp-service under block, and the later modules' egress is
      # still unknown.
      build_permit_egress_traffic: true
      # Grype runs as a supplementary signal here; the authoritative
      # dependency-risk gate remains the Sonatype CLM lane
      # (gerrit-clm.yaml). Do not fail the Verified vote on Grype findings
      # while running alongside Jenkins.
      grype_permit_fail: true
      # Gerrit-aware checkout inputs. Blanked on a GERRIT_DISABLED manual
      # run so the reusable workflow performs a normal checkout.
      # yamllint disable-line rule:line-length
      gerrit_refspec: ${{ !inputs.GERRIT_DISABLED && inputs.GERRIT_REFSPEC || '' }}
      # yamllint disable-line rule:line-length
      gerrit_project: ${{ !inputs.GERRIT_DISABLED && inputs.GERRIT_PROJECT || '' }}
      # yamllint disable-line rule:line-length
      gerrit_branch: ${{ !inputs.GERRIT_DISABLED && inputs.GERRIT_BRANCH || '' }}
      # gerrit_url falls back to the GERRIT_URL repository variable.

  # Report the overall workflow conclusion back to Gerrit as a Verified
  # vote.
  vote:
    name: 'Report Status to Gerrit'
    if: ${{ always() && inputs.GERRIT_DISABLED != true }}
    needs: [clear-vote, build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # workflow-conclusion lists run jobs via the API
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - name: 'Get workflow conclusion'
        # yamllint disable-line rule:line-length
        uses: im-open/workflow-conclusion@8eac7f17381a6917bc04fec3e2c92e70ebc37526  # v3.0.0
      - name: 'Set vote'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@a1c036a59b94c8ab89de26d378f6a28cc7378b13  # v1.1.2
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}  # zizmor: ignore[secrets-outside-env]
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: ${{ env.WORKFLOW_CONCLUSION }}
