---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# SonarQube Cloud analysis for cps.
#
# Replaces two Jenkins jobs, cps-sonar (daily branch scan) and
# cps-sonar-verify (per-patchset), with one lane that does both. It
# reports to the same SonarCloud project the Jenkins jobs use,
# onap_cps in organisation onap, so history is continuous.
#
# Discovery is filename-convention based: the name contains BOTH
# 'gerrit' AND 'verify', so gerrit_to_platform dispatches it on
# patchset-created alongside gerrit-verify.yaml. The file must exist on
# every active branch; this deployment covers master.
name: 'Gerrit Sonar Verify'

# yamllint disable-line rule:truthy
on:
  schedule:
    # Daily, replacing the cron on the Jenkins cps-sonar job. An odd
    # minute lets GitHub's queue randomise the exact start.
    - cron: "23 1 * * *"

  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: 'Branch that change is against'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_ID:
        description: 'The ID for the change'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_NUMBER:
        description: 'The Gerrit number'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_URL:
        description: 'URL to the change'
        required: false
        type: string
        default: ''
      GERRIT_EVENT_TYPE:
        description: 'Type of Gerrit event'
        required: false
        type: string
        default: ''
      GERRIT_PATCHSET_NUMBER:
        description: 'The patch number for the change'
        required: false
        type: string
        default: ''
      GERRIT_PATCHSET_REVISION:
        description: 'The revision sha'
        required: false
        type: string
        default: ''
      GERRIT_PROJECT:
        description: 'Project in Gerrit'
        required: false
        type: string
        default: ''
      GERRIT_REFSPEC:
        description: 'Gerrit refspec of change'
        required: false
        type: string
        default: ''
      GERRIT_DISABLED:
        description: 'Run without Gerrit components'
        required: false
        default: false
        type: boolean

concurrency:
  group: 'sonar-${{ github.event.inputs.GERRIT_CHANGE_ID || github.run_id }}'
  cancel-in-progress: true

permissions: {}

jobs:
  # Clear any previous Verified vote so a dispatched change starts from
  # a clean state. Skipped for the scheduled branch scan.
  clear-vote:
    name: 'Clear Gerrit Vote'
    # yamllint disable-line rule:line-length
    if: github.event_name == 'workflow_dispatch' && inputs.GERRIT_DISABLED != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - name: 'Clear votes'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@a1c036a59b94c8ab89de26d378f6a28cc7378b13  # v1.1.2
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}  # zizmor: ignore[secrets-outside-env]
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear
      - name: 'Allow replication'
        run: sleep 10s

  sonarqube-cloud:
    name: 'SonarQube Cloud'
    needs: clear-vote
    if: >-
      always()
      && (needs.clear-vote.result == 'success'
          || needs.clear-vote.result == 'skipped')
    permissions:
      contents: read
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/sonarqube-cloud.yaml@6f5f52540d9d66de7d9f8b8cdb6b6a595a746652  # v0.1.0
    with:
      # Same SonarCloud project the Jenkins jobs report to, so the
      # migration does not fork the analysis history.
      sonar_organization: 'onap'
      sonar_project_key: 'onap_cps'
      #
      # Branch decoration is the subtle part under Gerrit. Sonar infers
      # branch context from the CI provider, and a gerrit_to_platform
      # dispatch looks like a workflow_dispatch on the target branch. Left
      # alone, every patchset would overwrite master's analysis with
      # unmerged code.
      #
      # A dispatched change is therefore analysed as change-<number>
      # targeting the Gerrit branch, which Sonar treats as a short-lived
      # branch: results stay per-change and expire on their own. The
      # scheduled run has no change, so it analyses the branch itself and
      # is what keeps master's own metrics current.
      # yamllint disable-line rule:line-length
      sonar_branch_name: ${{ (github.event_name == 'workflow_dispatch' && !inputs.GERRIT_DISABLED && inputs.GERRIT_CHANGE_NUMBER != '') && format('change-{0}', inputs.GERRIT_CHANGE_NUMBER) || inputs.GERRIT_BRANCH || github.ref_name }}
      # yamllint disable-line rule:line-length
      sonar_branch_target: ${{ (github.event_name == 'workflow_dispatch' && !inputs.GERRIT_DISABLED && inputs.GERRIT_CHANGE_NUMBER != '') && (inputs.GERRIT_BRANCH || 'master') || '' }}
      #
      # Build before analysing so the Java analyser sees bytecode and the
      # JaCoCo report; a source-only scan reports no coverage. Phases
      # match the Jenkins jobs' 'clean install'. java_version is left
      # unset so the lane detects the project's JDK rather than pinning a
      # value that can drift out of step with the POMs.
      build_type: 'maven'
      mvn_phases: 'clean install'
      mvn_params: '-Djib.skip=true --fail-at-end'
      #
      # Wait for the quality gate so its verdict is visible in the run,
      # but do not yet fail on it. The Jenkins job it replaces does fail
      # (sonarcloud-qualitygate-wait), and this lane should end up there
      # too. It starts short of that deliberately: the gate is evaluated
      # against new-code conditions, this lane analyses changes as
      # short-lived branches where Jenkins did not, and casting Verified-1
      # on contributors' changes before that verdict has been observed to
      # be correct is the exact failure this migration spent its time
      # removing. Flip fail_on_quality_gate once a cycle of runs shows the
      # verdict matching Jenkins.
      wait_for_quality_gate: true
      fail_on_quality_gate: false
      #
      # Maven pulls from artifact CDNs that are impractical to enumerate
      # in the allow-list, and the build shares this job with the scan.
      build_permit_egress_traffic: true
      #
      # Gerrit-aware checkout. Blank for the scheduled run and for a
      # manual GERRIT_DISABLED run, so the lane does a normal checkout.
      # yamllint disable-line rule:line-length
      gerrit_refspec: ${{ github.event_name == 'workflow_dispatch' && !inputs.GERRIT_DISABLED && inputs.GERRIT_REFSPEC || '' }}
      # yamllint disable-line rule:line-length
      gerrit_project: ${{ github.event_name == 'workflow_dispatch' && !inputs.GERRIT_DISABLED && inputs.GERRIT_PROJECT || '' }}
      # yamllint disable-line rule:line-length
      gerrit_branch: ${{ github.event_name == 'workflow_dispatch' && !inputs.GERRIT_DISABLED && inputs.GERRIT_BRANCH || '' }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      # The organisation's authoritative Maven settings: the onap-public
      # mirror plus the docker.pull.registry and docker.push.registry
      # properties the POMs reference without defaulting. Credential-free,
      # and none are needed because the ONAP public group serves
      # anonymously and this lane only resolves dependencies.
      maven_global_settings: ${{ vars.MVN_GLOBAL_SETTINGS }}

  # Report the overall conclusion back to Gerrit as a Verified vote.
  vote:
    name: 'Report Status to Gerrit'
    # yamllint disable-line rule:line-length
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.GERRIT_DISABLED != true }}
    needs: [clear-vote, sonarqube-cloud]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # workflow-conclusion lists run jobs via the API
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - name: 'Get workflow conclusion'
        # yamllint disable-line rule:line-length
        uses: im-open/workflow-conclusion@8eac7f17381a6917bc04fec3e2c92e70ebc37526  # v3.0.0
      - name: 'Set vote'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@a1c036a59b94c8ab89de26d378f6a28cc7378b13  # v1.1.2
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}  # zizmor: ignore[secrets-outside-env]
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: ${{ env.WORKFLOW_CONCLUSION }}
