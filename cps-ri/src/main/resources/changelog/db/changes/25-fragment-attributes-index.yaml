databaseChangeLog:
  - changeSet:
      author: cps
      comment: Add GIN index to fragment attributes for the containment checks of cps path text() conditions
      id: 25
      # CREATE INDEX CONCURRENTLY cannot run inside a transaction
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT count(*) FROM pg_index WHERE indexrelid = to_regclass('idx_fragment_attributes') AND indisvalid
      changes:
        # an interrupted concurrent build leaves an invalid index behind, which would block the retry
        - sql:
            sql: DROP INDEX CONCURRENTLY IF EXISTS idx_fragment_attributes
        - sql:
            sql: CREATE INDEX CONCURRENTLY idx_fragment_attributes ON fragment USING gin (attributes jsonb_path_ops)
      rollback:
        - sql:
            sql: DROP INDEX CONCURRENTLY IF EXISTS idx_fragment_attributes
